<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Sin conexión · Devsoul</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; width: 100%; text-align: center; padding: 32px 24px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { color: rgba(255,255,255,.6); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    button { background: #bdf61d; color: #000; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; font-size: 15px; width: 100%; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="/icons/icon.svg" alt="Devsoul" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos con el servidor. Revisá tu conexión e intentá de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </main>
</body>
</html>
